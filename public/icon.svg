<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="viper-head" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="4" />

  <!-- Time Rings (Chrono Recoil dial) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="3" stroke-dasharray="24 16" />

  <!-- Undulating Serpentine Body Segments (Spine) -->
  <g id="spine">
    <ellipse cx="256" cy="420" rx="18" ry="14" fill="#047857" stroke="#10b981" stroke-width="2" />
    <ellipse cx="230" cy="380" rx="22" ry="17" fill="#047857" stroke="#10b981" stroke-width="2" />
    <ellipse cx="218" cy="336" rx="26" ry="20" fill="#047857" stroke="#10b981" stroke-width="2.5" />
    <ellipse cx="232" cy="292" rx="30" ry="23" fill="#047857" stroke="#10b981" stroke-width="3" />
    <ellipse cx="266" cy="254" rx="34" ry="26" fill="#047857" stroke="#10b981" stroke-width="3" />
    <ellipse cx="284" cy="214" rx="36" ry="28" fill="#047857" stroke="#10b981" stroke-width="3" />
    <ellipse cx="268" cy="174" rx="34" ry="26" fill="#047857" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Arrow-Shaped Real-Life Viper Head -->
  <path d="M 256,70 
           C 285,110 324,145 330,170 
           C 336,195 320,215 285,212 
           C 272,211 264,222 256,222 
           C 248,222 240,211 227,212 
           C 192,215 176,195 182,170 
           C 188,145 227,110 256,70 Z" 
        fill="url(#viper-head)" 
        stroke="#34d399" 
        stroke-width="5" 
        filter="url(#neon-glow)" />

  <!-- Forked Sensory Tongue -->
  <path d="M 256,70 L 256,34 M 256,34 L 244,16 M 256,34 L 268,16" 
        fill="none" 
        stroke="#f43f5e" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Dorsal Diamond / Crown Markings -->
  <polygon points="256,120 270,145 256,165 242,145" fill="#fef08a" opacity="0.9" />
  <polygon points="256,126 265,145 256,159 247,145" fill="#047857" />

  <!-- Supraocular Ridges & Vertical Slit Eyes -->
  <!-- Left Eye -->
  <ellipse cx="228" cy="148" rx="8" ry="14" transform="rotate(-15 228 148)" fill="#fbbf24" stroke="#030712" stroke-width="2" />
  <ellipse cx="228" cy="148" rx="2.5" ry="11" transform="rotate(-15 228 148)" fill="#030712" />
  <circle cx="226" cy="144" r="2.5" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="284" cy="148" rx="8" ry="14" transform="rotate(15 284 148)" fill="#fbbf24" stroke="#030712" stroke-width="2" />
  <ellipse cx="284" cy="148" rx="2.5" ry="11" transform="rotate(15 284 148)" fill="#030712" />
  <circle cx="282" cy="144" r="2.5" fill="#ffffff" />

  <!-- Pit Organs -->
  <circle cx="242" cy="108" r="3" fill="#030712" />
  <circle cx="270" cy="108" r="3" fill="#030712" />

  <!-- Dual Polarity Energy Auras (Cyan & Amber) -->
  <circle cx="160" cy="256" r="32" fill="url(#cyan-glow)" opacity="0.25" filter="url(#neon-glow)" />
  <circle cx="160" cy="256" r="14" fill="#38bdf8" />
  <circle cx="352" cy="256" r="32" fill="url(#amber-glow)" opacity="0.25" filter="url(#neon-glow)" />
  <circle cx="352" cy="256" r="14" fill="#fbbf24" />
</svg>
